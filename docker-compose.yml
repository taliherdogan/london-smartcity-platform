x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: smartcity-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 8
      # Bounded disk retention per partition (64 MB x 32 partitions <= ~2 GB max) & fast 32 MB segments
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_MINUTES: 15
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_LOG_SEGMENT_BYTES: 33554432
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      # High-throughput broker & zero-recompression tuning
      KAFKA_COMPRESSION_TYPE: producer
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_QUEUED_MAX_REQUESTS: 500
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    mem_limit: 1024m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - smartcity-net

  redis:
    image: redis:7-alpine
    container_name: smartcity-redis
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --dir
      - /data
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
      - --client-output-buffer-limit
      - "pubsub 64mb 16mb 60"
      - --tcp-backlog
      - "511"
      - --tcp-keepalive
      - "60"
    volumes:
      - redis_data:/data
    mem_limit: 384m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - smartcity-net

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartcity-mssql
    hostname: mssql
    ports:
      - "${MSSQL_HOST_PORT:-1434}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SmartCity#2026!}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1536}
    volumes:
      - mssql_data:/var/opt/mssql
    mem_limit: 2048m
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    restart: unless-stopped
    networks:
      - smartcity-net

  generator:
    build:
      context: ./services/generator
      dockerfile: Dockerfile
    container_name: smartcity-generator
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEFAULT_RATE: ${DEFAULT_RATE:-100}
      MAX_EVENT_RATE: ${MAX_EVENT_RATE:-25000}
      API_POLL_INTERVAL_SEC: ${API_POLL_INTERVAL_SEC:-60}
      METADATA_PATH: /data/metadata/london_districts.json
    volumes:
      - ./data/metadata:/data/metadata:ro
    mem_limit: 512m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - smartcity-net

  spark-processor:
    build:
      context: ./services/spark_processor
      dockerfile: Dockerfile
    container_name: smartcity-spark
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mssql:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MSSQL_ENABLED: ${MSSQL_ENABLED:-true}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-SmartCityDB}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:-SmartCity#2026!}
      MSSQL_WRITE_EVERY_N_BATCHES: ${MSSQL_WRITE_EVERY_N_BATCHES:-1}
      MSSQL_RETENTION_DAYS: ${MSSQL_RETENTION_DAYS:-90}
      METADATA_PATH: /data/metadata/london_districts.json
      LAKE_DIR: /data/lake
      CHECKPOINT_DIR: /tmp/spark-spill/checkpoints
      SPARK_LOCAL_DIR: /tmp/spark-spill/local
      TRIGGER_INTERVAL_SEC: ${TRIGGER_INTERVAL_SEC:-2}
      SPARK_MASTER: ${SPARK_MASTER:-local[4]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1280m}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-50000}
      ARCHIVE_EVERY_N_BATCHES: ${ARCHIVE_EVERY_N_BATCHES:-10}
      ARCHIVE_CSV_ENABLED: ${ARCHIVE_CSV_ENABLED:-false}
      LAKE_MAX_SIZE_MB: ${LAKE_MAX_SIZE_MB:-512}
      RESET_STATE_ON_START: ${RESET_STATE_ON_START:-false}
    volumes:
      - ./data/metadata:/data/metadata:ro
      - lake_data:/data/lake
      - spark_spill:/tmp/spark-spill
    mem_limit: 3072m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/spark_healthy && [ $(($(date +%s) - $(stat -c %Y /tmp/spark_healthy))) -lt 30 ]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 35s
    restart: unless-stopped
    networks:
      - smartcity-net

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: smartcity-backend
    depends_on:
      redis:
        condition: service_healthy
      mssql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MSSQL_ENABLED: ${MSSQL_ENABLED:-true}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-SmartCityDB}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_SA_PASSWORD:-SmartCity#2026!}
      MSSQL_AUTO_BACKFILL_ENABLED: ${MSSQL_AUTO_BACKFILL_ENABLED:-true}
      MSSQL_AUTO_BACKFILL_HOURS: ${MSSQL_AUTO_BACKFILL_HOURS:-72}
      MSSQL_BACKFILL_ALLOW_TRAFFIC_MODEL: ${MSSQL_BACKFILL_ALLOW_TRAFFIC_MODEL:-false}
      CLOUD_ARCHIVE_REPO: ${CLOUD_ARCHIVE_REPO:-}
      CLOUD_ARCHIVE_BRANCH: ${CLOUD_ARCHIVE_BRANCH:-data-archive}
      CLOUD_ARCHIVE_TOKEN: ${CLOUD_ARCHIVE_TOKEN:-}
      CLOUD_ARCHIVE_LOCAL_DIR: /data/cloud_archive
      CLOUD_SYNC_INTERVAL_MIN: ${CLOUD_SYNC_INTERVAL_MIN:-30}
      BENCHMARK_RESULTS_DIR: /app/benchmark_results
      METADATA_PATH: /data/metadata/london_districts.json
      LAKE_DIR: /data/lake
      MAX_EVENT_RATE: ${MAX_EVENT_RATE:-25000}
      WS_MAX_CLIENTS: 200
      WS_SEND_TIMEOUT_SEC: 2.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./benchmarks/results:/app/benchmark_results
      - ./data/metadata:/data/metadata:ro
      - ./data/cloud_archive:/data/cloud_archive:ro
      - lake_data:/data/lake:ro
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    networks:
      - smartcity-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcity-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    mem_limit: 256m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - smartcity-net

  benchmark:
    build:
      context: ./benchmarks
      dockerfile: Dockerfile
    container_name: smartcity-benchmark
    profiles: ["benchmark"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RESULTS_DIR: /app/results
      METADATA_PATH: /data/metadata/london_districts.json
      SPARK_MASTER: ${BENCHMARK_SPARK_MASTER:-local[4]}
      SPARK_DRIVER_MEMORY: ${BENCHMARK_DRIVER_MEMORY:-3g}
      BENCHMARK_SCALES: ${BENCHMARK_SCALES:-100000,1000000,5000000}
      BENCHMARK_STREAM_RATES: ${BENCHMARK_STREAM_RATES:-100,500,2000,5000}
    volumes:
      - ./benchmarks/results:/app/results
      - ./data/metadata:/data/metadata:ro
      - benchmark_tmp:/tmp/benchmark_lake
    mem_limit: 4096m
    logging: *default-logging
    networks:
      - smartcity-net

volumes:
  lake_data:
  spark_spill:
  benchmark_tmp:
  redis_data:
  mssql_data:

networks:
  smartcity-net:
    driver: bridge
