name: 24/7 London Smart City Cloud Collector

on:
  schedule:
    # Public repo: unlimited free GitHub Actions minutes (every 15 min = 96 real snapshots/day)
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Keep snapshots for N days"
        required: false
        default: "90"

permissions:
  contents: write

concurrency:
  group: cloud-collector-data-archive
  cancel-in-progress: false

jobs:
  collect-london-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/cloud_collector/requirements.txt

      - name: Install collector dependencies
        run: pip install -r services/cloud_collector/requirements.txt

      - name: Prepare isolated data-archive branch
        env:
          ARCHIVE_BRANCH: data-archive
        run: |
          mkdir -p /tmp/archive-repo
          cd /tmp/archive-repo
          git init
          git config user.name "London SmartCity Collector Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin "${ARCHIVE_BRANCH}" >/dev/null 2>&1; then
            git fetch --depth=1 origin "${ARCHIVE_BRANCH}"
            git checkout -B "${ARCHIVE_BRANCH}" "origin/${ARCHIVE_BRANCH}"
          else
            git checkout --orphan "${ARCHIVE_BRANCH}"
            cat > README.md <<'EOF'
          # London Smart City — 24/7 Cloud Snapshot Archive

          This orphan branch stores lightweight 15-minute live snapshots collected from:
          - **Traffic:** Transport for London (TfL) Unified Road API (24 corridors -> 32 boroughs)
          - **Weather:** Open-Meteo Forecast API (32 boroughs)
          - **Air Quality:** Open-Meteo Air Quality API (32 boroughs)
          - **Energy:** Elexon BMRS + NESO Region 13 London

          Kept isolated from the main code branch so development history stays clean.
          EOF
            git add README.md
            git commit -m "chore: initialize data-archive branch"
          fi

      - name: Collect live London snapshot (TfL + Open-Meteo + Elexon + NESO)
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '90' }}
        run: |
          python services/cloud_collector/collect_snapshot.py \
            --output-dir /tmp/archive-repo \
            --metadata data/metadata/london_districts.json \
            --retention-days "${RETENTION_DAYS}" \
            --collector-name "github-actions-cron"

      - name: Commit and push snapshot to data-archive branch
        env:
          ARCHIVE_BRANCH: data-archive
        run: |
          cd /tmp/archive-repo
          git add -A
          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
            exit 0
          fi
          TS=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data: london snapshot ${TS}"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${ARCHIVE_BRANCH}"; then
              echo "Pushed snapshot to ${ARCHIVE_BRANCH} successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing and retrying..."
            git fetch --depth=1 origin "${ARCHIVE_BRANCH}" || true
            git pull --rebase origin "${ARCHIVE_BRANCH}" || true
            sleep 2
          done
          exit 1
